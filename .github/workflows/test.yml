name: test
on:
  push:
    paths-ignore:
      - LICENSE
      - README.*
  pull_request:
    paths-ignore:
      - LICENSE
      - README.*
jobs:
  test:
    uses: nimbase/setup-nim-action/.github/workflows/test_clue.yml@main
    with:
      nim-version: 'stable'
      pre-install-command: |
        set -eu
        DUCKDB_VERSION="1.5.2"
        case "${RUNNER_OS}" in
          Linux)
            sudo apt-get install -y unzip
            curl -fsSL -o /tmp/libduckdb.zip "https://install.duckdb.org/v${DUCKDB_VERSION}/libduckdb-linux-amd64.zip"
            rm -rf /tmp/duckdb_lib && mkdir -p /tmp/duckdb_lib
            unzip -q -o /tmp/libduckdb.zip -d /tmp/duckdb_lib
            sudo mkdir -p /usr/local/include /usr/local/lib
            sudo cp /tmp/duckdb_lib/duckdb.h /tmp/duckdb_lib/duckdb.hpp /usr/local/include/
            sudo cp /tmp/duckdb_lib/libduckdb.so /usr/local/lib/
            sudo ldconfig
            ;;
          macOS)
            curl -fsSL -o /tmp/libduckdb.zip "https://install.duckdb.org/v${DUCKDB_VERSION}/libduckdb-osx-universal.zip"
            rm -rf /tmp/duckdb_lib && mkdir -p /tmp/duckdb_lib
            unzip -q -o /tmp/libduckdb.zip -d /tmp/duckdb_lib
            xattr -c /tmp/duckdb_lib/libduckdb.dylib || true
            sudo mkdir -p /usr/local/include /usr/local/lib
            sudo cp /tmp/duckdb_lib/duckdb.h /tmp/duckdb_lib/duckdb.hpp /usr/local/include/
            sudo cp /tmp/duckdb_lib/libduckdb.dylib /usr/local/lib/
            echo "DYLD_LIBRARY_PATH=/usr/local/lib${DYLD_LIBRARY_PATH:+:${DYLD_LIBRARY_PATH}}" >> "$GITHUB_ENV"
            ;;
          Windows)
            work="$(mktemp -d)"
            curl -fsSL -o "${work}/libduckdb.zip" "https://install.duckdb.org/v${DUCKDB_VERSION}/libduckdb-windows-amd64.zip"
            powershell.exe -NoProfile -Command "Expand-Archive -Force -LiteralPath '$(cygpath -w "${work}/libduckdb.zip")' -DestinationPath '$(cygpath -w "${work}")'"
            dest="$(cygpath -u "${RUNNER_TEMP}")/duckdb"
            mkdir -p "${dest}/include" "${dest}/lib" "${dest}/bin"
            cp "${work}/duckdb.h" "${work}/duckdb.hpp" "${dest}/include/"
            cp "${work}/duckdb.lib" "${dest}/lib/"
            cp "${work}/duckdb.lib" "${dest}/lib/libduckdb.dll.a"
            cp "${work}/duckdb.dll" "${dest}/bin/"
            echo "C_INCLUDE_PATH=${dest}/include" >> "$GITHUB_ENV"
            echo "LIBRARY_PATH=${dest}/lib" >> "$GITHUB_ENV"
            echo "$(cygpath -w "${dest}/bin")" >> "$GITHUB_PATH"
            ;;
          *)
            echo "unsupported OS: ${RUNNER_OS}" >&2
            exit 1
            ;;
        esac
